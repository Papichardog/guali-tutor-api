spring.application.name=guali-tutor-api

# ---------------------------------------------------------------------------
# Servidor: HTTPS obligatorio en el puerto 8443 (no se abre ningún puerto HTTP)
# ---------------------------------------------------------------------------
server.port=8443
server.ssl.enabled=true
server.ssl.bundle=guali

# Bundle SSL "guali": keystore PKCS12 autofirmado, SOLO para desarrollo local.
# Se genera con keytool en src/main/resources/keystore/ (ver instrucciones del proyecto).
spring.ssl.bundle.jks.guali.keystore.location=classpath:keystore/guali-keystore.p12
spring.ssl.bundle.jks.guali.keystore.type=PKCS12
spring.ssl.bundle.jks.guali.keystore.password=${GUALI_SSL_PASSWORD:guali-dev-ssl}
spring.ssl.bundle.jks.guali.key.alias=guali
spring.ssl.bundle.jks.guali.key.password=${GUALI_SSL_PASSWORD:guali-dev-ssl}

# ---------------------------------------------------------------------------
# MariaDB: esquema existente "guali_tutor"
# Las credenciales NO van en el código: se leen de variables de entorno.
#   GUALI_DB_USER      (por defecto: root)
#   GUALI_DB_PASSWORD  (por defecto: vacía)
#   GUALI_DB_HOST      (por defecto: localhost)
#   GUALI_DB_PORT      (por defecto: 3306)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mariadb://${GUALI_DB_HOST:127.0.0.1}:${GUALI_DB_PORT:3306}/guali_tutor
spring.datasource.username=${GUALI_DB_USER:root}
spring.datasource.password=${GUALI_DB_PASSWORD:}

# ---------------------------------------------------------------------------
# JPA / Hibernate: el esquema ya existe y se administra con scripts SQL,
# así que Hibernate NO debe crear, modificar ni validar tablas al arrancar.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false